<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Photo Gallery</title>
    <style>
        @font-face {
            font-family: 'Dirty Stains'; 
            src: url('fonts/DirtyStains-DEMO.otf'); 
        }
        
        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --corner-color: #800000; 
        }
        body.dark {
            --bg-color: #121212;
            --text-color: #f9f9f9;
            --corner-color: #FFFDD0; 
        }
        body {
            font-family: 'Dirty Stains', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 20px;
            margin: 0;
            transition: background-color 0.4s, color 0.4s; 
        }
        .header-video {
            width: calc(100% + 40px);
            margin: -20px -20px 20px -20px;
            height: 300px;
            object-fit: cover;
            display: block;
            pointer-events: none;
            border: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .top-right-text {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: var(--corner-color); 
            transition: color 0.4s;
            z-index: 10;
        }
        .dark-mode-button {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Dirty Stains', sans-serif; 
            font-size: 18px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            z-index: 10;
        }
   </style>
</head>
<body>
    <button class="dark-mode-button" onclick="toggleDarkMode()">luna</button>
    <div class="top-right-text">SEX-MONEY-YACHT PARTIES</div>
    
    <video class="header-video" autoplay loop muted playsinline>
        <source src="videos/tara.mp4" type="video/mp4">
    </video>
    <h1>BLOCK 1 ART</h1>
    
    <div class="gallery">

        <div><img src="images/miss.jpg" alt="BIT 2"><p>BIT 2</p></div>
        <div><img src="images/ot.jpg" alt="BIT 3"><p>BIT 3</p></div>
        <div><img src="images/lala.jpg" alt="BIT 4"><p>BIT 4</p></div>
        <div><img src="images/lana.png" alt="BIT 5"><p>BIT 5</p></div>
        <div><img src="images/qwqw.jpg" alt="BIT 6"><p>BIT 6</p></div>
        <div><img src="images/temu.jpg" alt="BIT 7"><p>BIT 7</p></div>
        <div><img src="images/yeye.jpg" alt="BIT 8"><p>BIT 8</p></div>
        <div><img src="images/tyl.jpg" alt="BIT 9"><p>BIT 9</p></div>
        <div><img src="images/fafa.jpg" alt="BIT 10"><p>BIT 10</p></div>
        <div><img src="images/susu.jpg" alt="BIT 11"><p>BIT 11</p></div>
        <div><img src="images/dldl.jpg" alt="BIT 12"><p>BIT 12</p></div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark");
            const button = document.querySelector(".dark-mode-button");
            if (document.body.classList.contains("dark")) {
                button.textContent = "sol";
            } else {
                button.textContent = "luna";
            }
        }
    </script>
</body>
</html>
